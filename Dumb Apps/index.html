  </main>

  <script>
    (() => {
      const blockedTabs = document.querySelectorAll(".tab-link[data-under-construction]");
      if (!blockedTabs.length) return;

      blockedTabs.forEach((tab) => {
        const statusText = tab.getAttribute("data-under-construction") || "Under Construction";
        tab.setAttribute("aria-disabled", "true");
        tab.title = statusText;
        tab.addEventListener("click", (event) => {
          event.preventDefault();
        });
      });
    })();
  </script>
