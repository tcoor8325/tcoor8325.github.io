<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dumb Apps</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
    }

    .app-links {
      display: grid;
      gap: 10px;
    }

    .app-link {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #111111;
      background: #ffffff;
      color: #111111;
      text-decoration: none;
      font-size: 14px;
    }

    .app-link:hover,
    .app-link:focus-visible {
      background: #111111;
      color: #ffffff;
    }
  </style>
</head>
  <body>
  <nav class="app-links" aria-label="Dumb app links">
    <a class="app-link" href="apps/startup-generator/index.html">Startup Generator</a>
    <a class="app-link" href="apps/tone-generator/index.html">Tone Generator</a>
    <a class="app-link" href="../index.html">Return to Portfolio</a>
  </nav>
</body>
</html>
